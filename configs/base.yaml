# LibriTTS at BigVGAN's front end, Qwen2.5-0.5B trunk. SELF-CONTAINED.
#
# NO `base_config`. This file used to inherit from `fluenteditor.yaml`, which
# still carries the retired VCTK-era values -- 22050 Hz, 80 mel bins, HiFi-GAN,
# and `use_dualffn_trunk: false`. Every one was overridden here, so the run was
# correct, but the inheritance was a live trap rather than untidiness: the trunk
# flag WAS inherited as false for a while, and the config the brief pointed an
# agent at could not build the model the brief described. An agent reading the
# base to understand the model read the wrong sample rate, the wrong band count
# and the wrong vocoder.
#
# Flattened by resolving the full chain and emitting it. Verified: the resolved
# hparams dict is byte-identical to the two-file version apart from 18 keys that
# appear nowhere in any .py under the seed, the grader or scripts.

# ------------------------------------------------------------------------
# THE DONOR AND THE TRUNK
# ------------------------------------------------------------------------
trunk_donor: Qwen/Qwen2.5-0.5B
use_dualffn_trunk: true
trunk_layers: 14
trunk_layer_pick: ends
trunk_warm_start: true
trunk_freeze_tok_emb: true
trunk_adaptation: audio_lora
trunk_lora_rank: 8
trunk_lora_alpha: 16.0
trunk_use_text: true
trunk_use_ph: true
trunk_max_text: 48
trunk_grad_ckpt: true
trunk_inject: add
trunk_pretrained_lr_scale: 0.05
rope_half: true
rope_reset_at_nt: true

# ------------------------------------------------------------------------
# FRONT END -- must match BigVGAN exactly
# ------------------------------------------------------------------------
